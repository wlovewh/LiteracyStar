# =============================================================
#  Nginx 配置模板  deploy/nginx.conf
#  信息素养大赛模拟竞赛平台
#
#  重要: 服务器 443 端口已被 xray (VLESS+REALITY) 占用，
#        本配置仅监听 80 端口，不得改动 xray 服务。
#
#  用法: 复制到 /etc/nginx/sites-available/ 并创建软链接
#        sudo ln -s /etc/nginx/sites-available/info-literacy /etc/nginx/sites-enabled/
# =============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                 # 绑定域名后替换为你的域名

    # 前端静态资源
    root /var/www/info-literacy/frontend/dist;
    index index.html;

    # 访问日志
    access_log /var/log/nginx/info-literacy.access.log;
    error_log  /var/log/nginx/info-literacy.error.log;

    client_max_body_size 20m;

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SSE 实时排行榜 —— 必须放在 /api 之前，且关闭缓冲
    location /api/rank/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # 后端 API
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# -------------------------------------------------------------
# HTTPS 说明
# 443 端口由 xray 占用，如需 HTTPS 有两种方案:
#   A. 域名经 Cloudflare 代理，回源到 80 端口（推荐，无需改本配置）
#   B. 将 xray 迁移至其他端口后，再在本文件添加 443 server 块
# -------------------------------------------------------------
