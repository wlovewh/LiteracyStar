# =============================================================
#  Nginx 配置  competition-platform/deploy/nginx.conf
#  信息素养大赛 模拟竞赛平台 + 综合平台
#
#  重要: 服务器 443 端口已被 xray (VLESS+REALITY) 占用，
#        本配置仅监听 80 端口，不得改动 xray 服务。
# =============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    access_log /var/log/nginx/info-literacy.access.log;
    error_log  /var/log/nginx/info-literacy.error.log;

    # ================= 模拟竞赛平台（根路径） =================
    root /var/www/competition-platform/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SSE 实时排行榜 —— 必须放在 /api 之前，且关闭缓冲
    location /api/rank/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ================= 综合平台（/platform 路径） =================
    location /platform/assets/ {
        alias /var/www/integrated-platform/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /platform/ {
        alias /var/www/integrated-platform/frontend/dist/;
        try_files $uri $uri/ /platform/index.html;
    }

    location = /platform {
        return 301 /platform/;
    }

    # 综合平台 API
    location /platform-api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # 综合平台 WebSocket（聊天室）
    location /platform-ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 24h;
    }

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
